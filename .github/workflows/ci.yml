name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block committed credentials
        run: |
          if git ls-files | grep -E '(^|/)(local\.properties|google-services\.json|.*\.(jks|keystore))$'; then
            echo "Credentials and signing keys must not be committed."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Build apps and run unit tests
        run: ./gradlew :buyer:assembleDebug :seller:assembleDebug :buyer:testDebugUnitTest :seller:testDebugUnitTest :common:testDebugUnitTest
